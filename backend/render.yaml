services:
  - type: web
    name: devprofile-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true

  - type: cron
    name: devprofile-ai-db-cleanup
    env: python
    region: oregon
    plan: free
    schedule: "0 3 * * *"  # Daily maintenance sweep at 03:00 UTC
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/cleanup_db.py --retention-days 1 --unverified-days 7
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
